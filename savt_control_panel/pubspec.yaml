name: control_panel
description: Приложение с авторизацией, ИИ-чатом, базой знаний и сканером QR

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Навигация и UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.0.0
  provider: ^6.1.1
  
  # Сканер QR кода
  mobile_scanner: ^4.0.1
  
  # Иконки
  icons_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Раскомментируйте, когда добавите лого в папку assets
  # assets:
  #   - assets/logo.png